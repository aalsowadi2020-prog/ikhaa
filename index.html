<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>متابعة التحصيل - مدارس الإخاء</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f3f7a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
html{direction:rtl}
/* Layout: mobile app shell. Sticky school header, scrolling content column, fixed bottom tab bar. Cards per record, bottom sheets for forms. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface2:#eaeff8; --fg:#142039; --muted:#5a6882; --line:#d5dcea;
  --brand:#1f3f7a; --brand-fg:#ffffff; --gold:#fdbe00; --gold-soft:#fff3c4; --link:#0b4a9e;
  --ok:#1f7a4d; --ok-soft:#dff3e8; --warn:#9a6700; --warn-soft:#fff1c9; --bad:#b3261e; --bad-soft:#fde3e0; --info-soft:#dde9fb;
  --lv0:#d9534f; --lv1:#f0a63a; --lv2:#3f9d86; --lv3:#1f3f7a;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif; --f-head:'Readex Pro','IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  --radius:14px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1626; --surface:#162238; --surface2:#1d2d49; --fg:#e8eefb; --muted:#9db0cf; --line:#2b3d5e;
  --brand:#2c56a3; --brand-fg:#ffffff; --gold:#fdbe00; --gold-soft:#4a3d0c; --link:#8db6ff;
  --ok:#5fd29b; --ok-soft:#173b2b; --warn:#f3c453; --warn-soft:#46380d; --bad:#ff8f86; --bad-soft:#4a1f1c; --info-soft:#1d3358;
  --lv0:#ef7773; --lv1:#f3b559; --lv2:#5cc0a8; --lv3:#7ea6ec; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1626; --surface:#162238; --surface2:#1d2d49; --fg:#e8eefb; --muted:#9db0cf; --line:#2b3d5e;
  --brand:#2c56a3; --brand-fg:#ffffff; --gold:#fdbe00; --gold-soft:#4a3d0c; --link:#8db6ff;
  --ok:#5fd29b; --ok-soft:#173b2b; --warn:#f3c453; --warn-soft:#46380d; --bad:#ff8f86; --bad-soft:#4a1f1c; --info-soft:#1d3358;
  --lv0:#ef7773; --lv1:#f3b559; --lv2:#5cc0a8; --lv3:#7ea6ec; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
.app{max-width:720px;margin:0 auto;min-width:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-fg);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
header.top img{width:44px;height:44px;border-radius:10px;background:#fff;padding:2px;flex:none}
header.top .t{min-width:0;flex:1}
header.top .t b{display:block;font-family:var(--f-head);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .t span{font-size:12px;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--fg);white-space:nowrap}
header.top .chip{background:rgba(255,255,255,.16);color:#fff;border:0;cursor:pointer}
main{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.card h2{font-size:16px;margin-bottom:10px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--muted)}
summary{cursor:pointer;font-family:var(--f-head);font-size:16px}
.notice{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.notice.info{background:var(--info-soft);border-color:var(--link)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.kpi b{display:block;font-family:var(--f-head);font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi b.na{font-size:13px;font-weight:500;color:var(--muted);padding-top:7px}
.kpi.warn b{color:var(--bad)}.kpi.good b{color:var(--ok)}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--brand-fg)}
.btn.alt{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2a2200}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer}
.rec .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rec .h b{font-size:15px;overflow-wrap:anywhere}
.rec .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--link)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;border:1px dashed var(--line);border-radius:12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;min-width:0;height:var(--nav-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--link);font-weight:700}
nav.tabs button[aria-current="page"]::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--gold);margin-top:1px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:17px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;max-width:90%}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);min-width:0}
.bar i{display:block;height:100%}
.dist{display:grid;grid-template-columns:minmax(70px,1.2fr) 2fr 34px;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.dist:last-child{border-bottom:0}
.dist .n{overflow-wrap:anywhere}.dist .c{font-variant-numeric:tabular-nums;text-align:end}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mgrid button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:600;min-height:64px}
.role-pick{display:grid;gap:10px}
.role-pick button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.role-pick button b{font-family:var(--f-head);font-size:16px}.role-pick button span{color:var(--muted);font-size:13px}
.hero{background:var(--brand);color:var(--brand-fg);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:center}
.hero img{width:64px;height:64px;border-radius:12px;background:#fff;padding:3px;flex:none}
.hero h1{font-size:19px}.hero p{margin:4px 0 0;font-size:13px;opacity:.9}
.small{font-size:12px;color:var(--muted)}
.guide p,.guide li{font-size:14px}.guide ul{padding-inline-start:20px;margin:6px 0}
pre.out{white-space:pre-wrap;word-break:break-all;background:var(--surface2);border-radius:10px;padding:10px;max-height:200px;overflow:auto;font-size:11px;direction:ltr;text-align:left}
@media print{header.top,nav.tabs,.noprint{display:none!important}body{padding:0;background:#fff;color:#000}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>

  [['pre'],['post']].forEach(([p])=>{const a=num(rec[p+'Score']),b=num(rec[p+'Total']);if(a!=null&&b==null)setErr(p+'Total','أدخل الدرجة الكلية');if(b!=null&&b<=0)setErr(p+'Total','يجب أن تكون أكبر من صفر');if(a!=null&&b!=null&&a>b)setErr(p+'Score','الدرجة أكبر من الدرجة الكلية')})}

function kpi(l,v,cls){return`<div class="kpi ${cls||''}"><small>${esc(l)}</small>${v==null?'<b class="na">لا بيانات كافية</b>':`<b>${v}</b>`}</div>`}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

function stats(ss){
 const I=ss.map(s=>({s,i:info(s)}));const sum=k=>I.reduce((a,x)=>a+(x.i[k]||0),0);
 const due=sum('due'),ex=sum('execDue'),met=I.filter(x=>x.i.goal==='تحقق').length,nmet=I.filter(x=>x.i.goal==='لم يتحقق').length;
 return{I,cases:ss.length,uniq:new Set(ss.map(s=>s.name)).size,weak:I.filter(x=>levelIdx(x.i.lvl)===0).length,diag:I.filter(x=>x.i.diagN>0).length,plan:I.filter(x=>x.i.planN>0).length,wnp:I.filter(x=>x.i.weakNoPlan).length,
  due,ex,late:sum('late'),rate:due>0?ex/due:null,imp:avg(I.filter(x=>x.i.imp!=null).map(x=>x.i.imp)),met,nmet,goalRate:met+nmet>0?met/(met+nmet):null,overdue:I.filter(x=>x.i.overdue).length,
  post:I.filter(x=>x.i.post!=null).length,pre:avg(I.filter(x=>x.i.pre!=null).map(x=>x.i.pre)),postAvg:avg(I.filter(x=>x.i.post!=null).map(x=>x.i.post))}}
function sel(id,key,val,label){return`<label class="f">${label}<select id="${id}" data-fil="${key}">${opts(listOf(id==='fg'?'grade':id==='fs'?'subj':id==='fx'?'sex':id==='ft'?'teach':'supv'),val).replace('— اختر —','الكل')}</select></label>`}
function distHtml(ss,key,title){
 const groups={};ss.forEach(s=>{const k=s[key]||'—';(groups[k]=groups[k]||[]).push(s)});
 const L=DB.settings.levels,cols=['var(--lv0)','var(--lv1)','var(--lv2)','var(--lv3)'];
 const rows=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([k,arr])=>{
  const cnt=L.map(l=>arr.filter(s=>levelOf(pctOf(s.score,s.total))===l.n).length);const noScore=arr.length-cnt.reduce((a,b)=>a+b,0);
  return`<div class="dist"><span class="n">${esc(k)}</span><div class="bar" title="${esc(L.map((l,i)=>l.n+': '+cnt[i]).join(' | '))}">${cnt.map((c,i)=>c?`<i style="width:${c/arr.length*100}%;background:${cols[i]}"></i>`:'').join('')}</div><span class="c">${arr.length}</span></div>`}).join('');
 return`<div class="card"><h2>${title}</h2><div class="legend">${L.map((l,i)=>`<span><i style="background:${cols[i]}"></i>${esc(l.n)}</span>`).join('')}</div>${rows||'<div class="empty">لا توجد حالات</div>'}</div>`}

function permView(){

 const c=(r,e)=>{const p=(PERM[r]||{})[e]||'';return['v','a','e','d'].map(a=>p.includes(a)?'✓':'—').join(' ')};
 return`<h2>جدول الصلاحيات</h2><div class="notice">هذه سياسة تنظيمية لواجهة التطبيق. المعلم والمشرف يرون الحالات المسندة لاسمهم فقط. لا تمنع من يملك الجهاز أو ملف النسخة من تغيير الدور أو قراءة البيانات.</div><div class="card tbl"><table><tr><th>القسم</th><th>معلم<br><span class="small">عرض/إضافة/تعديل/حذف</span></th><th>مشرف</th><th>إدارة</th></tr>${Object.keys(names).map(e=>`<tr><td>${names[e]}</td><td>${c('teacher',e)}</td><td>${c('supervisor',e)}</td><td>${c('admin',e)}</td></tr>`).join('')}<tr><td>الإعدادات والقوائم</td><td>— — — —</td><td>— — — —</td><td>✓ ✓ ✓ ✓</td></tr></table></div>
 <h3>سياسة الحسابات وكلمات المرور</h3><ul class="guide"><li>حساب مستقل لكل مستخدم، ولا تُشارك كلمات المرور.</li><li>كلمة المرور من 5 أرقام حد أدنى حسب سياسة المدرسة (ضعيفة أمنيًا؛ زدها إن سمحت المنصة).</li><li>تغيير كلمة المرور عند أول دخول وعند الاشتباه بانكشافها يحتاج منصة تدعمه؛ هذا التطبيق لا يخزن كلمات مرور ولا يدعم ذلك.</li><li>حالات الحساب: نشط، موقوف مؤقتًا، معطل، بانتظار التفعيل. التعطيل لا يحذف السجلات.</li><li>استعادة الوصول بعد التحقق من الهوية، وتُوثَّق في سجل الحسابات دون أي كلمة مرور.</li></ul>`}

/* ---------- settings ---------- */
function settingsView(){
 const s=DB.settings,inp=(id,l,v,t)=>`<label class="f">${l}<input id="${id}" type="${t||'text'}" value="${esc(v)}"></label>`;
 return`<h2>القوائم والإعدادات</h2>
 <div class="card"><h2>بيانات المدرسة</h2><div class="fgrid">${inp('s_country','الجمهورية',s.country)}${inp('s_ministry','الوزارة',s.ministry)}${inp('s_office','المكتب',s.office)}${inp('s_region','المنطقة',s.region)}${inp('s_school','المدرسة',s.school)}${inp('s_year','العام الدراسي',s.year)}${inp('s_asof','تاريخ الاحتساب (اتركه فارغًا لاستخدام اليوم)',s.asOf,'date')}${inp('s_weeks','مدة الخطة (1-8 أسابيع)',s.planWeeks,'number')}</div></div>
 <div class="card"><h2>المستويات (الحد الأدنى %)</h2><div class="grid2">${s.levels.map((l,i)=>`<label class="f">اسم المستوى ${i+1}<input id="lv_n${i}" value="${esc(l.n)}"></label><label class="f">الحد الأدنى %<input id="lv_l${i}" type="number" value="${l.lo}" ${i===0?'disabled':''}></label>`).join('')}</div></div>
 <div class="card"><h2>القوائم (عنصر في كل سطر)</h2><div class="fgrid">${EDITABLE_LISTS.map(k=>`<label class="f">${LIST_TITLES[k]}<textarea id="ls_${k}" rows="5">${esc(listOf(k).join('\n'))}</textarea></label>`).join('')}</div></div>
 <div class="card"><h2>الخطة الافتراضية حسب الأسبوع</h2>${DB.phases.map((p,i)=>`<h3>الأسبوع ${i+1}</h3><div class="fgrid"><label class="f">المرحلة<input id="ph${i}_0" value="${esc(p[0])}"></label><label class="f">الإجراء الافتراضي<textarea id="ph${i}_1">${esc(p[1])}</textarea></label><label class="f">أداة القياس<input id="ph${i}_2" value="${esc(p[2])}"></label><label class="f">معيار النجاح<input id="ph${i}_3" value="${esc(p[3])}"></label></div>`).join('')}</div>
 <button class="btn gold" data-act="savesettings">حفظ الإعدادات</button>`}
function saveSettings(){
 const s=DB.settings,v=id=>$('#'+id).value.trim();
 const w=num(v('s_weeks'));if(w==null||w<1||w>8){toast('مدة الخطة من 1 إلى 8');return}
 const lv=s.levels.map((l,i)=>({n:v('lv_n'+i)||l.n,lo:i===0?0:(num(v('lv_l'+i))??l.lo)}));
 for(let i=1;i<lv.length;i++)if(lv[i].lo<=lv[i-1].lo){toast('يجب أن تتزايد حدود المستويات');return}
 Object.assign(s,{country:v('s_country'),ministry:v('s_ministry'),office:v('s_office'),region:v('s_region'),school:v('s_school'),year:v('s_year'),asOf:v('s_asof'),planWeeks:w,levels:lv});
 EDITABLE_LISTS.forEach(k=>{DB.lists[k]=[...new Set($('#ls_'+k).value.split('\n').map(x=>x.trim()).filter(Boolean))]});
 DB.phases=DB.phases.map((p,i)=>[0,1,2,3].map(j=>v(`ph${i}_${j}`)));
 save();toast('تم حفظ الإعدادات');render()}

/* ---------- backup ---------- */
const DATA_KEYS=['students','diag','plan','tea','sup','pp','wk'];
function exportAll(){return JSON.stringify(DB)}
function exportScoped(){const ids=new Set(scopedStudents().map(s=>s.id)),o={v:1,scoped:true,by:ME.role+':'+ME.name,at:new Date().toISOString()};
 o.students=DB.students.filter(s=>ids.has(s.id));DATA_KEYS.slice(1).forEach(k=>o[k]=DB[k].filter(r=>ids.has(r.caseId)));return JSON.stringify(o)}
function csvOf(ent){const E=ENT[ent],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 return[E.fields.map(f=>q(f.l)).join(',')].concat(DB[E.coll].filter(r=>recVisible(ent,r)).map(r=>E.fields.map(f=>q(r[f.k])).join(','))).join('\n')}
function backupView(){
 const adm=ME.role==='admin';
 return`<h2>${adm?'النسخ الاحتياطي والاستيراد':'إرسال بياناتي للإدارة'}</h2>
 <div class="notice info">${adm?'احفظ نسخة مؤرخة بعد كل أسبوع عمل في مكان آمن وقيّد الوصول إليها، وجرّب استعادتها دوريًا. النسخة تحتوي بيانات الطلاب كاملة فلا تُرسلها عبر قنوات عامة.':'يصدّر لك بيانات طلابك فقط. أرسل النص أو الملف إلى الإدارة لدمجه في النسخة المركزية.'}</div>
 <div class="card"><h2>${adm?'تصدير نسخة كاملة (JSON)':'تصدير بياناتي (JSON)'}</h2><div class="row"><button class="btn" data-act="copyjson">نسخ النص</button><button class="btn alt" data-act="dljson">تنزيل ملف</button></div><div class="small">إذا لم يبدأ التنزيل في هذا العرض فاستخدم «نسخ النص» والصقه في رسالة أو ملف.</div></div>
 <div class="card"><h2>تصدير جدول (CSV لفتحه في Excel)</h2><div class="row">${ENT_ORDER.filter(e=>can(e,'v')).map(e=>`<button class="btn alt sm" data-act="csv" data-ent="${e}">${ENT[e].title}</button>`).join('')}</div><div id="csvout"></div></div>
 ${adm||can('stu','a')?`<div class="card"><h2>استيراد</h2><label class="f">الصق نص JSON أو اختر ملفًا<textarea id="imp" placeholder="الصق هنا"></textarea></label><input id="impfile" type="file" accept=".json,application/json,text/plain"><div class="row" style="margin-top:10px"><button class="btn" data-act="merge">دمج (تحديث الموجود وإضافة الجديد)</button>${adm?'<button class="btn danger" data-act="replace" id="repbtn">استبدال كل البيانات</button>':''}</div><div class="small">الدمج يطابق السجلات بمعرّفها ولا يغيّر الإعدادات أو المستخدمين.</div></div>`:''}
 ${adm?'<div class="card"><h2>مسح كل البيانات</h2><div class="small">يعيد التطبيق إلى حالته الأولى على هذا الجهاز.</div><button class="btn danger sm" data-act="wipe" id="wipebtn">مسح البيانات</button></div>':''}`}
function parseImport(){const t=$('#imp').value.trim();if(!t){toast('الصق النص أو اختر ملفًا أولًا');return null}try{const o=JSON.parse(t);if(!o||typeof o!=='object'||!Array.isArray(o.students))throw 0;return o}catch(e){toast('النص غير صالح. تأكد من نسخه كاملًا.');return null}}
function doMerge(o){let n=0;const allowed=ME.role==='admin'?DATA_KEYS:DATA_KEYS.filter(k=>k==='students'?false:true);
 DATA_KEYS.forEach(k=>{if(!Array.isArray(o[k]))return;o[k].forEach(r=>{if(!r||!r.id)return;const i=DB[k].findIndex(x=>x.id===r.id);if(i>=0)DB[k][i]=r;else DB[k].push(r);n++})});save();toast('تم دمج '+n+' سجلًا');render()}

/* ---------- guide ---------- */
function guideView(){
 return`<h2>دليل الاستخدام</h2><div class="card guide">
 <h3>البدء</h3><ul><li>الإدارة: من «المزيد ← القوائم والإعدادات» أضف المعلمين والمشرفين والمواد والصفوف، ثم أضف الحالات (كل حالة = طالب في مادة بمعرّف فريد).</li><li>المعلم: يسجل التشخيص والخطة والإجراءات والقياس والمتابعة لطلابه.</li><li>المشرف: يراجع الخطط ويسجل المتابعات والتوجيهات.</li></ul>
 <h3>طريقة الحساب</h3><ul><li>نسبة التنفيذ = الإجراءات المنفذة المستحقة ÷ الإجراءات المستحقة. المستحق له تاريخ استحقاق وحلّ موعده. لا تدخل الإجراءات التي لم يحن موعدها ولا التي بلا تاريخ استحقاق.</li><li>التحسن = النسبة البعدية − القبلية (نقاط مئوية). الزيادة النسبية = التحسن ÷ القبلية، وتظهر «لا ينطبق» إذا كانت القبلية صفرًا. تُقارن النسب لا الدرجات الخام.</li><li>السبب يبقى «محتملًا» حتى يُسجَّل دليل التحقق.</li><li>الخطة الافتراضية 4 أسابيع: تشخيص، تدخل علاجي، تثبيت، قياس نهائي. يمكن التمديد حتى 8 أسابيع.</li></ul>
 <h3>الحفظ والنسخ الاحتياطي</h3><ul><li>البيانات تُحفظ على هذا الجهاز فقط داخل المتصفح. مسح بيانات المتصفح أو حذف التطبيق يمحوها.</li><li>خذ نسخة احتياطية (JSON) أسبوعيًا من «المزيد ← النسخ الاحتياطي»، واحفظها في مكان آمن مقيّد الوصول، واختبر استعادتها.</li><li>لجمع بيانات عدة هواتف: يرسل كل معلم «بياناتي» وتدمجها الإدارة.</li></ul>
 <h3>حدود الأمان</h3><ul><li>لا يوجد تسجيل دخول حقيقي. اختيار الدور يهيّئ الواجهة فقط، وأي شخص يستخدم الجهاز يستطيع تغييره.</li><li>لا تُخزَّن كلمات مرور في هذا التطبيق، ولا تكتبها في أي خانة.</li><li>ما يحتاج نظامًا خارجيًا: التحقق من الهوية، تغيير كلمة المرور الإجباري، قفل الحساب، حجب بيانات عن مستخدم غير مخوّل فعليًا، وسجل تدقيق تلقائي.</li></ul></div>`}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,ent=t.dataset.ent,id=t.dataset.id;
 switch(a){
  case'nav':go(t.dataset.go,ent||null);break;
  case'role':ME={role:null,name:''};render();break;
  case'pickrole':pickRole(t.dataset.role);break;
  case'confirmrole':{const n=($('#rname').value||'').trim();if(!n){toast('اختر أو اكتب الاسم');return}ME={role:t.dataset.role,name:n};lsSet(RKEY,JSON.stringify(ME));closeSheet();V={view:'home'};render();break}
  case'close':closeSheet();break;
  case'add':openForm(ent);break;
  case'open':openForm(ent,id);break;
  case'saveform':saveForm();break;
  case'delform':delForm();break;
  case'rep':REP_ID=id;go('report');break;
  case'copyrep':{const r=$('#rep');if(r)copyText(r.innerText,'تم نسخ التقرير')}break;
  case'savesettings':saveSettings();break;
  case'copyjson':copyText(ME.role==='admin'?exportAll():exportScoped(),'تم نسخ النسخة الاحتياطية');break;
  case'dljson':{const j=ME.role==='admin'?exportAll():exportScoped();tryDownload('ikhaa-backup-'+isoToday()+'.json',j,'application/json');toast('إن لم يبدأ التنزيل فاستخدم «نسخ النص»')}break;
  case'csv':{const c=csvOf(ent);$('#csvout').innerHTML=`<div class="row" style="margin:8px 0"><button class="btn sm" data-act="copycsv" data-ent="${ent}">نسخ</button><button class="btn sm alt" data-act="dlcsv" data-ent="${ent}">تنزيل</button></div><pre class="out">${esc(c.slice(0,1500))}${c.length>1500?'\n...':''}</pre>`}break;
  case'copycsv':copyText(csvOf(ent),'تم نسخ الجدول');break;
  case'dlcsv':tryDownload(ent+'-'+isoToday()+'.csv',csvOf(ent),'text/csv');toast('إن لم يبدأ التنزيل فاستخدم «نسخ»');break;
  case'merge':{const o=parseImport();if(o)doMerge(o)}break;
  case'replace':{const b=$('#repbtn');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='اضغط مرة أخرى لتأكيد الاستبدال';return}
   const o=parseImport();if(!o)return;if(o.scoped){toast('هذه نسخة جزئية؛ استخدم الدمج');return}DB=Object.assign(emptyDB(),o);DB.settings=Object.assign(emptyDB().settings,o.settings||{});DB.lists=Object.assign(clone(LISTS0),o.lists||{});save();toast('تم استبدال البيانات');render();break}
  case'wipe':{const b=$('#wipebtn');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='اضغط مرة أخرى لتأكيد المسح النهائي';return}DB=emptyDB();save();toast('تم مسح البيانات');go('home');break}
 }});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;fillList()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset&&t.dataset.fil!==undefined){FIL[t.dataset.fil]=t.value;render();return}
 if(t.id==='repsel'){REP_ID=t.value;render();return}
 if(t.id==='impfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#imp').value=String(r.result).replace(/^﻿/,'')};r.readAsText(t.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

const _render=render;
render=function(){_render();if(ME.role&&V.view==='list'&&$('#lst'))fillList()};

/* ---------- boot ---------- */
loadDB();
try{const r=JSON.parse(lsGet(RKEY)||'null');if(r&&r.role&&ROLES[r.role])ME=r}catch(e){}
render();

try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
